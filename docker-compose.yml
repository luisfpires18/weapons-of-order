# Local development PostgreSQL for Weapons of Order.
#
# Port 5433 on the host, not 5432, so this container coexists with a natively
# installed PostgreSQL instance instead of fighting it for the default port.
#
# These credentials are local-development-only and are intentionally committed so a
# fresh clone starts with zero configuration. Deployed environments supply their own
# connection string through environment configuration and never reuse these values.
services:
  postgres:
    image: postgres:18-alpine
    container_name: woo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: weapons_of_order
      POSTGRES_USER: woo_dev
      POSTGRES_PASSWORD: woo_dev
    ports:
      - "5433:5432"
    volumes:
      # Postgres 18+ images want the mount at /var/lib/postgresql, not .../data:
      # the image stores data in a major-version subdirectory and refuses to start
      # when the older mount point is used.
      - woo-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U woo_dev -d weapons_of_order"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  woo-postgres-data:
